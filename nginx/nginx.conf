# nginx.conf — Reverse proxy (development).
#
# nginx is the single front door. It routes:
#   /            -> frontend (React dashboard)
#   /api, /healthz, /readyz, /metrics -> backend
#
# Putting everything behind one origin avoids CORS headaches and gives us one
# place to add TLS, rate limiting and headers.

events {}

http {
    # Basic rate limit: 10 requests/sec per IP, with a small burst. A cheap
    # first line of defence against brute-force and scraping.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    upstream backend  { server backend:8000; }
    upstream frontend { server frontend:80; }

    server {
        listen 80;

        # API + health + metrics go to the backend.
        location ~ ^/(api|healthz|readyz|metrics) {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Everything else is the frontend SPA.
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }
}

# nginx.prod.conf — Reverse proxy (production, TLS terminated here).
#
# Differences from dev:
#   * listens on 443 with TLS; 80 only redirects to 443,
#   * HSTS + security headers,
#   * /metrics is NOT exposed publicly (scraped internally by Prometheus).

events {}

http {
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    upstream backend  { server backend:8000; }
    upstream frontend { server frontend:80; }

    # Redirect all plain HTTP to HTTPS.
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Tell browsers to always use HTTPS for a year.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # /metrics is internal-only: block it at the edge.
        location /metrics { return 404; }

        location ~ ^/(api|healthz|readyz) {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }
}

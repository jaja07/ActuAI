[project]
name = "actuai-backend"
version = "0.1.0"
description = "ActuAI orchestrator backend (multi-agent + datalake + HITL)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # ---- Web / API ----
    "fastapi>=0.137.1",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",      # form parsing for the login endpoint
    "prometheus-client>=0.21.1",     # /metrics endpoint
    # ---- Agents / LLM / RAG ----
    "langchain>=1.3.9",
    "langchain-community>=0.4.2",
    "langchain-qdrant>=1.1.0",       # Qdrant vectorstore (moved out of langchain-community)
    "langchain-huggingface>=1.2.2",  # HuggingFaceEmbeddings (moved out of langchain-community)
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.6.0",
    "pypdf>=6.13.3",
    # ---- ORM / databases ----
    "sqlmodel>=0.0.38",
    "psycopg[binary]>=3.3.4",        # sync PostgreSQL driver v3 (avoids a psycopg2/Windows-locale crash)
    # ---- Security ----
    "pyjwt>=2.10.1",                 # JWT signing/verification
    "bcrypt>=4.2.1",                 # password hashing (used directly)
    # ---- Config / HTTP ----
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ActuAI - Human-in-the-Loop Operations Dashboard</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('actuai_theme');
          var dark = stored ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) { /* no-op */ }
      })();
    </script>
  </head>
  <body class="bg-surface text-on-surface h-screen overflow-hidden font-body-md text-body-md">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

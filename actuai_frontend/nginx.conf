# actuai_frontend/nginx.conf — conf.d server block for the production image.
# Serves the built SPA and reverse-proxies /api to the backend container, so
# the browser only ever talks to one origin (http://localhost:3000).

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ---- API reverse proxy -------------------------------------------------
    location /api/ {
        proxy_pass http://actuai-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Health probes proxied through the front door (smoke tests).
    location = /healthz {
        proxy_pass http://actuai-backend:8000/healthz;
    }
    location = /readyz {
        proxy_pass http://actuai-backend:8000/readyz;
    }

    # Prometheus metrics stay internal (scraped on the compose network).
    location /metrics {
        return 404;
    }

    # ---- Static SPA ---------------------------------------------------------
    # Fingerprinted assets are immutable; cache them hard.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: every other route serves index.html (client-side routing).
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# docker-compose.yml — ActuAI stack.
#
#   docker compose up --build
#
# Brings up the data layer (PostgreSQL + Qdrant), the simulated SAP ERP
# (actuai_mock_data), the orchestrator backend and the production frontend
# (nginx serving the built SPA on :3000, reverse-proxying /api to the backend).
# LLM calls hit NVIDIA NIM for real when USE_MOCK_LLM=false in .env.

services:
  # ----------------------------------------------------
  # DATALAKE RELATIONNEL : PostgreSQL
  # ----------------------------------------------------
  actuai-postgres:
    image: postgres:15-alpine
    container_name: actuai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: actuai_user
      POSTGRES_PASSWORD: actuai_password
      POSTGRES_DB: actuai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actuai_user -d actuai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # DATALAKE VECTORIEL : Qdrant
  # ----------------------------------------------------
  actuai-qdrant:
    image: qdrant/qdrant:latest
    container_name: actuai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # Port REST API (Celui que FastAPI va utiliser)
      - "6334:6334" # Port gRPC (Optimisé pour l'ingestion massive)
    volumes:
      - qdrant_data:/qdrant/storage

  # ----------------------------------------------------
  # ERP SIMULÉ : Mock SAP BAPI (FastAPI + SQLite, seedé via Faker)
  # ----------------------------------------------------
  actuai-mock-data:
    build:
      context: .
      dockerfile: actuai_mock_data/Dockerfile
    container_name: actuai-mock-data
    restart: unless-stopped
    working_dir: /app
    env_file: .env
    environment:
      PYTHONPATH: /app
      DATABASE_URL: "sqlite:////app/data/sap_mock.db"
      MOCK_NETWORK_DRIVE_DIR: /app/output/network_drives
      MOCK_EXCEL_DIR: /app/output/excel_shares
      WEBHOOK_TARGET_URL: http://actuai-backend:8000/api/ingest/email
    # Seed the SQLite DB (Faker), then serve the BAPI on 8080.
    command: >
      sh -c "python -m actuai_mock_data.sap_api.seeder &&
             python -m uvicorn actuai_mock_data.sap_api.main:app --host 0.0.0.0 --port 8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/docs').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "8080:8080"
    volumes:
      - mock_sqlite_data:/app/data
      # Shared with actuai-backend so document_indexer.py can read the
      # generated PDFs (see MOCK_DOCS_DIR below).
      - mock_output_data:/app/output

  # ----------------------------------------------------
  # ORCHESTRATEUR : Backend ActuAI (FastAPI + agents + HITL)
  # ----------------------------------------------------
  actuai-backend:
    build: ./actuai_backend
    container_name: actuai-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Point the backend at the in-network services (override .env localhost).
      DATABASE_URL_BACKEND: postgresql+psycopg://actuai_user:actuai_password@actuai-postgres:5432/actuai_db
      QDRANT_URL: http://actuai-qdrant:6333
      BAPI_BASE_URL: http://actuai-mock-data:8080
      # Read the PDFs actuai-mock-data generated, via the shared volume below.
      MOCK_DOCS_DIR: /app/mock_docs/network_drives/Fournisseurs_Archives
      # Pull from the mock SAP on boot and keep polling.
      ETL_AUTO_START: "true"
      # USE_MOCK_LLM flows from .env: false = real NVIDIA NIM calls (default),
      # true = deterministic stubs (no network / no API key needed).
    depends_on:
      actuai-postgres:
        condition: service_healthy
      actuai-mock-data:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - mock_output_data:/app/mock_docs:ro

  # ----------------------------------------------------
  # FRONTEND : React Dashboard (Human-in-the-Loop)
  # Production build served by nginx; /api is reverse-proxied to the backend
  # (see actuai_frontend/nginx.conf), so the app lives at http://localhost:3000.
  # ----------------------------------------------------
  actuai-frontend:
    build: ./actuai_frontend
    container_name: actuai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - actuai-backend

  # ----------------------------------------------------
  # MONITORING : Prometheus + Grafana (optional but wired)
  # ----------------------------------------------------
  actuai-prometheus:
    image: prom/prometheus:latest
    container_name: actuai-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - actuai-backend

  actuai-grafana:
    image: grafana/grafana:latest
    container_name: actuai-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - actuai-prometheus

volumes:
  # Déclaration des volumes nommés pour la persistance des données
  # Si tu coupes les conteneurs, les données ne seront pas perdues
  # NB : le seeder du mock SAP drop + recrée sa base SQLite à chaque démarrage
  # du conteneur actuai-mock-data (comportement accepté pour la démo).
  postgres_data:
  qdrant_data:
  mock_sqlite_data:
  mock_output_data:
  grafana_data:
